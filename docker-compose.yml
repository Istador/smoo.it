version: "3.7"

services:
  smoo-api:
    build: .
    user: "33:33"
    restart: unless-stopped
    ports:
    - 8080:80
    volumes:
    - ./html/data/.env:/var/www/html/data/.env:ro
    environment:
      # public servers (from Discord)
      SMOO_SERVER_DC_PIP_01: piplup.smoo.it:1027
      SMOO_SERVER_DC_PIP_02: piplup.smoo.it:1028
      SMOO_SERVER_DC_PIP_03: piplus.smoo.it:1029
      SMOO_SERVER_DC_SAN_01: sanae.smoo.it:1027
      #SMOO_SERVER_DC_TMD_01: tmdog.smoo.it:1027
      SMOO_SERVER_DC_FOC_01: f0c0s.smoo.it:1027
      SMOO_SERVER_DC_SLE_01: sleepyy.smoo.it:1027
      SMOO_SERVER_DC_PAR_01: parknich.smoo.it:1027
      SMOO_SERVER_DC_ROC_01: rocket.smoo.it:1027
      SMOO_SERVER_DC_LUW_01: luwuna.smoo.it:1027
      SMOO_SERVER_DC_LUW_02: luwuna.smoo.it:1028
      SMOO_SERVER_DC_LUW_03: luwuna.smoo.it:1029
      SMOO_SERVER_DC_KAM_01: kamron.smoo.it:1027
      SMOO_SERVER_DC_KAM_02: 66.220.29.106:1027
      SMOO_SERVER_DC_MUZ_01: muz.smoo.it:1027
      SMOO_SERVER_DC_MUZ_02: larbe.org:1027

      # public servers (website only)
      SMOO_SERVER_WWW_RCL_1: rcl.smoo.it:1027
      SMOO_SERVER_WWW_RCL_2: rcl.smoo.it:1028
      SMOO_SERVER_WWW_RCL_3: rcl.smoo.it:1029
      SMOO_SERVER_WWW_RCL_4: rcl.smoo.it:1030
      SMOO_SERVER_WWW_KRO_1: krokilex.smoo.it:1027
      SMOO_SERVER_WWW_JEF_1: jeff.smoo.it:1027
      SMOO_SERVER_WWW_SNA_1: snafty.smoo.it:62102
      SMOO_SERVER_WWW_COL_1: colbster.smoo.it:1027

      # default refresh rate
      SMOO_EXPIRE: 10

      # refresh servers with JSON API more often
      SMOO_EXPIRE_JSON_RCL_1: rcl.smoo.it:1027:1
      SMOO_EXPIRE_JSON_RCL_2: rcl.smoo.it:1028:1
      SMOO_EXPIRE_JSON_RCL_3: rcl.smoo.it:1029:1
      SMOO_EXPIRE_JSON_RCL_4: rcl.smoo.it:1030:1
      SMOO_EXPIRE_JSON_PIP_1: piplup.smoo.it:1027:3
      SMOO_EXPIRE_JSON_PIP_2: piplup.smoo.it:1028:3
      SMOO_EXPIRE_JSON_PIP_3: piplus.smoo.it:1029:3
      SMOO_EXPIRE_JSON_RAD_1: radiated.smoo.it:1027:3
      SMOO_EXPIRE_JSON_LUW_1: luwuna.smoo.it:1027:3
      SMOO_EXPIRE_JSON_LUW_2: luwuna.smoo.it:1028:3
      SMOO_EXPIRE_JSON_LUW_3: luwuna.smoo.it:1029:3

      # refresh dead servers less often:
      SMOO_EXPIRE_DEAD_01: f0c0s.smoo.it:1027:30
      SMOO_EXPIRE_DEAD_02: yann.smoo.it:1027:30
      SMOO_EXPIRE_DEAD_03: jeff.smoo.it:1027:30
      SMOO_EXPIRE_DEAD_04: rocket.smoo.it:1027:30
      SMOO_EXPIRE_DEAD_05: sanae.smoo.it:1027:30
      SMOO_EXPIRE_DEAD_06: snafty.smoo.it:62102:30
